[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingua-franca"
version = "0.1.0"
description = "An agent-based simulation of trade, vocabulary, and communication strategy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = ["matplotlib>=3.10,<4", "numpy>=1.25,<3"]

[project.scripts]
lingua-franca = "lingua_franca.society:main"

[tool.setuptools.packages.find]
include = ["lingua_franca*"]
