[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galapagos-language-lab"
version = "0.1.0"
description = "Lingua Franca: artificial societies, trade, culture, and reinforcement learning"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = ["matplotlib>=3.10,<4"]

[project.scripts]
lingua-franca = "galapagos.society:main"
galapagos = "galapagos.__main__:main"
galapagos-play = "galapagos.play:main"

[tool.setuptools.packages.find]
include = ["galapagos*"]
