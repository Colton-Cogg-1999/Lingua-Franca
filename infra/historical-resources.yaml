    targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: galapagos
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: ''
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      securityContext:
        runAsUser: 0
      volumes:
      - name: data
        hostPath:
          path: /galapagos-data/redpanda
          type: DirectoryOrCreate
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
        args:
        - redpanda
        - start
        - --mode
        - dev-container
        - --smp
        - '1'
        - --memory
        - 1G
        - --reserve-memory
        - 0M
        - --kafka-addr
        - 0.0.0.0:9092
        - --advertise-kafka-addr
        - redpanda:9092
        - --rpc-addr
        - 0.0.0.0:33145
        - --advertise-rpc-addr
        - redpanda:33145
        - --set
        - redpanda.internal_topic_replication_factor=1
        volumeMounts:
        - name: data
          mountPath: /var/lib/redpanda/data
        resources:
          requests:
            cpu: 500m
            memory: 1536Mi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /v1/status/ready
            port: 9644
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /v1/status/ready
            port: 9644
          initialDelaySeconds: 60
          periodSeconds: 10
