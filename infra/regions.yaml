apiVersion: v1
kind: Namespace
metadata:
  name: galapagos
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coordinator
  namespace: galapagos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: geography-controller
  namespace: galapagos
rules:
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - create
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: geography-controller
  namespace: galapagos
subjects:
- kind: ServiceAccount
  name: coordinator
  namespace: galapagos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: geography-controller
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: experiment-plans
  namespace: galapagos
data:
  plan.json: '{"name": "roman-fracture-2000", "description": "Shared ancestry, loss
    of interregional contact, and selective secondary contact; a stylized experiment,
    not historical reconstruction.", "regions": ["Iberia", "Gaul", "Italia", "Dacia",
    "Sardinia", "Dalmatia"], "rounds": 2000, "diagnostic_interval": 50, "config":
    {"seed": 476, "islands": 6, "population": 60, "encounters": 4, "shared_ancestry":
    true, "contact": 0.3, "migration": 0.003, "turnover": 0.02, "repair": 0.7, "learning":
    0.8, "prestige_bias": 0.4, "innovation": 0.003, "sound_change": 0.03, "construction_innovation":
    0.004, "retention": 0.985, "friendship_bias": 0.85, "compact_events": true}, "phases":
    [{"name": "shared_contact", "through": 200, "edges": "all"}, {"name": "fragmentation",
    "through": 1500, "edges": []}, {"name": "selective_reconnection", "through": 2000,
    "edges": [[0, 1], [1, 2], [2, 5]]}]}'
  smoke.json: '{"name": "region-smoke", "description": "Shared ancestry, loss of interregional
    contact, and selective secondary contact; a stylized experiment, not historical
    reconstruction.", "regions": ["Iberia", "Gaul", "Italia", "Dacia", "Sardinia",
    "Dalmatia"], "rounds": 9, "diagnostic_interval": 3, "config": {"seed": 476, "islands":
    6, "population": 6, "encounters": 4, "shared_ancestry": true, "contact": 0.3,
    "migration": 0.003, "turnover": 0.02, "repair": 0.7, "learning": 0.8, "prestige_bias":
    0.4, "innovation": 0.003, "sound_change": 0.03, "construction_innovation": 0.004,
    "retention": 0.985, "friendship_bias": 0.85, "compact_events": true}, "phases":
    [{"name": "shared_contact", "through": 3, "edges": "all"}, {"name": "fragmentation",
    "through": 6, "edges": []}, {"name": "selective_reconnection", "through": 9, "edges":
    [[0, 1], [1, 2], [2, 5]]}]}'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: galapagos
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coordinator-egress
  namespace: galapagos
spec:
  podSelector:
    matchLabels:
      app: coordinator
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: region
    ports:
    - protocol: TCP
      port: 8100
  - to:
    - podSelector:
        matchLabels:
          app: redpanda
    ports:
    - protocol: TCP
      port: 9092
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-access
  namespace: galapagos
spec:
  podSelector:
    matchLabels:
      app: redpanda
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: coordinator
    - podSelector:
        matchLabels:
          app: redpanda
    ports:
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 33145
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: redpanda
    ports:
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 33145
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: region-0
  namespace: galapagos
spec:
  podSelector:
    matchLabels:
      galapagos/island: '0'
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: coordinator
    - &id001
      podSelector:
        matchExpressions:
        - key: galapagos/island
          operator: In
          values:
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
    ports:
    - protocol: TCP
      port: 8100
  egress:
  - to:
    - *id001
    ports:
    - protocol: TCP
      port: 8100
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: v1
kind: Service
metadata:
  name: region-0
  namespace: galapagos
spec:
  selector:
    app: region
    galapagos/island: '0'
  ports:
  - port: 8100
    targetPort: 8100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: region-0
  namespace: galapagos
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: region
      galapagos/island: '0'
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        galapagos/island: '0'
      containers:
      - name: worker
        image: galapagos-regions:v2r2
        imagePullPolicy: Never
        command:
        - python
        - -m
        - galapagos.regions
        - --island
        - '0'
        - --host
        - 0.0.0.0
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8100
          initialDelaySeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 8100
          initialDelaySeconds: 10
          timeoutSeconds: 3
---
