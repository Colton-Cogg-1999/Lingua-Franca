kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: galapagos
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /home/colton/Projects/Galapagos/runtime/data
        containerPath: /galapagos-data
  - role: worker
    labels:
      galapagos/island: "0"
  - role: worker
    labels:
      galapagos/island: "1"
  - role: worker
    labels:
      galapagos/island: "2"
  - role: worker
    labels:
      galapagos/island: "3"
  - role: worker
    labels:
      galapagos/island: "4"
  - role: worker
    labels:
      galapagos/island: "5"
