apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-egress
  namespace: galapagos
spec:
  podSelector:
    matchLabels:
      app: analytics
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redpanda
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-analytics-reader
  namespace: galapagos
spec:
  podSelector:
    matchLabels:
      app: redpanda
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: analytics
      ports:
        - protocol: TCP
          port: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: galapagos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: consumer
          image: galapagos-analytics:v1
          imagePullPolicy: Never
          command: [python, -m, galapagos.analytics]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: analytics
              mountPath: /data/analytics
      volumes:
        - name: analytics
          hostPath:
            path: /galapagos-data/analytics
            type: DirectoryOrCreate
