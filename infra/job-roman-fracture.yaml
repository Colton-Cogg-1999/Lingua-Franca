apiVersion: batch/v1
kind: Job
metadata:
  name: roman-fracture
  namespace: galapagos
spec:
  backoffLimit: 6
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        app: coordinator
        experiment: roman-fracture
    spec:
      restartPolicy: OnFailure
      serviceAccountName: coordinator
      nodeSelector:
        node-role.kubernetes.io/control-plane: ''
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: data
        hostPath:
          path: /galapagos-data
          type: Directory
      - name: plans
        configMap:
          name: experiment-plans
      containers:
      - name: coordinator
        image: galapagos-regions:v2r2
        imagePullPolicy: Never
        command:
        - python
        - -m
        - galapagos.longrun
        - --plan
        - /plans/plan.json
        - --output
        - /data/experiment/roman-fracture-2000
        - --worker-url
        - http://region-0:8100
        - --worker-url
        - http://region-1:8100
        - --worker-url
        - http://region-2:8100
        - --worker-url
        - http://region-3:8100
        - --worker-url
        - http://region-4:8100
        - --worker-url
        - http://region-5:8100
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: plans
          mountPath: /plans
          readOnly: true
